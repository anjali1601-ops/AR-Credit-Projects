[project]
name = "dunning-assistant"
version = "0.1.0"
description = "Multi-agent predictive dunning and collections assistant for accounts receivable"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "pydantic>=2.5",
    "typer>=0.12",
    "rich>=13.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
hf = ["transformers>=4.40", "torch>=2.2"]
langfuse = ["langfuse>=2.0"]
phoenix = ["arize-phoenix-otel>=0.6", "opentelemetry-sdk>=1.25"]
openai = ["openai>=1.30"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
dunning = "dunning.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
