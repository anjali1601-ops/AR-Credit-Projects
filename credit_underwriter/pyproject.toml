[project]
name = "credit-underwriter"
version = "0.1.0"
description = "Supervisor-led multi-agent credit underwriting for enterprise B2B onboarding"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Cursor Agent", email = "cursoragent@cursor.com" }]
dependencies = [
    "langgraph>=0.2.50",
    "pydantic>=2.8",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
chroma = ["chromadb>=0.5.5"]
openai = ["openai>=1.40"]

[project.scripts]
credit-underwriter = "credit_underwriter.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
