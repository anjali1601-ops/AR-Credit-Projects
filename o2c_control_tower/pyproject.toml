[project]
name = "o2c-control-tower"
version = "0.1.0"
description = "Director view of order-to-cash: aging, DSO bridge, 14-day cash, and the human action queue."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
